<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Masrofi">
  <meta name="description" content="Masrofi (مصروفي): a simple weekly budget and savings tracker for students.">
  <title>Masrofi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/logo/IconOnly_Transparent.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo/IconOnly_Transparent.png" sizes="1024x1024">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- app.js draws the current screen here -->
    <main id="view"></main>
  </div>

  <nav class="tabbar" aria-label="Main">
    <div class="tabbar-inner">
      <button type="button" class="tab active" data-page="dashboard" aria-current="page">
        <span class="tab-icon" data-icon="home" aria-hidden="true"></span>
        <span class="tab-label"></span>
      </button>
      <button type="button" class="tab" data-page="history" aria-current="false">
        <span class="tab-icon" data-icon="history" aria-hidden="true"></span>
        <span class="tab-label"></span>
      </button>
      <button type="button" class="tab" data-page="savings" aria-current="false">
        <span class="tab-icon" data-icon="wallet" aria-hidden="true"></span>
        <span class="tab-label"></span>
      </button>
      <button type="button" class="tab" data-page="profile" aria-current="false">
        <span class="tab-icon" data-icon="user" aria-hidden="true"></span>
        <span class="tab-label"></span>
      </button>
    </div>
  </nav>

  <noscript>Masrofi needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
